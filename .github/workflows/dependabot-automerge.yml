name: Dependabot Auto-Merge

# pull_request_target (unlike pull_request) exposes Actions secrets to Dependabot-triggered runs.
# This is only safe because no step checks out or executes code from the pull request.
on: pull_request_target

permissions:
  contents: read

jobs:
  auto-merge:
    name: Enable auto-merge
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3

      # An App token is required: changes made with GITHUB_TOKEN do not trigger further workflows.
      - name: Create GitHub App token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}

      # Policy (grouped PRs report their highest update type and most critical dependency type):
      # - npm and GitHub Actions minor/patch updates merge once the required CI checks pass.
      # - Majors merge only where CI exercises everything they affect: devDependencies (format, lint,
      #   tests, commitlint; never shipped) and the `actions-ci` group (run by CI, Docker build included).
      # - Manual: runtime majors (unit tests mock parts of the delivery path), majors of release-only
      #   actions (cannot run without side effects), Docker base images (Node.js/Debian majors on
      #   rtl-sdr hardware are not testable in CI) and unknown update types.
      - name: Enable auto-merge
        if: >-
          contains(fromJSON('["npm_and_yarn", "github_actions"]'), steps.metadata.outputs.package-ecosystem) && (
            contains(fromJSON('["version-update:semver-minor", "version-update:semver-patch"]'), steps.metadata.outputs.update-type) || (
              steps.metadata.outputs.update-type == 'version-update:semver-major' && (
                steps.metadata.outputs.dependency-type == 'direct:development' ||
                steps.metadata.outputs.dependency-group == 'actions-ci'
              )
            )
          )
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --auto --squash "$PR_URL"
